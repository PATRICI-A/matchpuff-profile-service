name: CD – Azure QA Deploy

on:
  push:
    branches:
      - develop

env:
  JAVA_VERSION: '21'
  REGISTRY: ghcr.io
  IMAGE_NAME: patrici-a/matchpuff-profile-service
  CONTAINER_APP_NAME: patricia-profile-service-prod
  RESOURCE_GROUP: rg-patricia-prod

jobs:

  build-and-push:
    name: "Build & Push Docker Image (QA)"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build JAR
        run: mvn clean package -DskipTests -B

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:qa-latest

  deploy:
    name: "Deploy to Azure Container Apps (QA)"
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:qa-latest \
            --set-env-vars \
              SPRING_PROFILES_ACTIVE=prod \
              SPRING_DATA_MONGODB_URI=${{ secrets.MONGO_URI_QA }} \
              SPRING_DATA_MONGODB_DATABASE=profileservice-qa \
              CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }} \
              CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }} \
              CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
