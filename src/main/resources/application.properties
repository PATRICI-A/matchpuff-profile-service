spring.application.name=profile-service
spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.database=${MONGO_DB:profileservice}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Default false: en produccion Azure maneja TLS; fail-fast solo activo si se configura explicitamente
app.startup.fail-fast=${APP_STARTUP_FAIL_FAST:false}

matching.service.url=${MATCHING_SERVICE_URL}
matching.service.path=${MATCHING_SERVICE_PATH}

spring.security.user.name=admin
spring.security.user.password=admin123

# Puerto y SSL por defecto (sin SSL). El perfil ssl activa HTTPS para dev local con certificado
server.port=${SERVER_PORT:8080}
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEY_STORE:classpath:keystore.p12}
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD}
server.ssl.key-store-type=${SSL_KEY_STORE_TYPE:PKCS12}
server.ssl.key-alias=${SSL_KEY_ALIAS:profile-service}

feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=10000
