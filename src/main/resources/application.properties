spring.application.name=profile-service
spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.database=${MONGO_DB:profileservice}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Default false: en produccion Azure maneja TLS; fail-fast solo activo si se configura explicitamente
app.startup.fail-fast=${APP_STARTUP_FAIL_FAST:false}

matching.service.url=${MATCHING_SERVICE_URL}
matching.service.path=${MATCHING_SERVICE_PATH}

spring.security.user.name=admin
spring.security.user.password=admin123

server.port=${SERVER_PORT:8086}

feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=10000

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

rabbitmq.exchange.friendship=friendship.exchange
rabbitmq.routing-key.friendship-created=friendship.created
rabbitmq.queue.friendship-created=friendship.created.queue
